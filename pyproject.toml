[project]
name = "causalaudit"
version = "0.1.0"
description = "TabPFN-3.5 audits causal claims: explicit assumptions, TabPFN-CRT falsification, doubly-robust estimates"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "scikit-learn>=1.6",
    "lightgbm>=4.3",
    "networkx>=3.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
    "torch>=2.4",
    "tabpfn>=9.0",
    "tabpfn-extensions>=0.6.3",
    "tabpfn-client>=0.6",
]

[project.scripts]
causalaudit = "causalaudit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causalaudit"]

# CUDA build of PyTorch on Windows/Linux (PyPI's Windows wheels are CPU-only); default wheels on macOS.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
